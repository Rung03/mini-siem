upstream siem_api {
    server __API_HOST__;
}

# Shared between the plain and TLS listeners.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/siem-app.conf;
}

# TLS. The certificate is generated on first boot when none is mounted; see
# docker-entrypoint.d/40-generate-cert.sh and docs/setup_saas.md.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Only sent over TLS, so a plain-HTTP appliance install is unaffected.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/siem-app.conf;
}
