# The application itself: static files plus the two proxied paths.
# Included by both the port 80 and the port 443 server blocks.

root /usr/share/nginx/html;
index index.html;

client_max_body_size 64m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

# Single-page app: unknown paths are routes, not missing files.
location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# The browser-facing API.
location /api/ {
    proxy_pass http://siem_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# The machine-to-machine ingest endpoint, so senders and operators can use the
# same host and port.
location /ingest {
    proxy_pass http://siem_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
}
