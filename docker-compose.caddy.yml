# overlay ขึ้นอินเทอร์เน็ต: Caddy ขอใบรับรอง Let's Encrypt และถือพอร์ต 80/443

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. mysiem.duckdns.org}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

  web:
    ports: !override []

  backend:
    environment:
      TRUST_PROXY_HOPS: 2
      COOKIE_SECURE: "true"
    ports: !override
      - "${SYSLOG_UDP_PORT:-514}:514/udp"
      - "${SYSLOG_TCP_PORT:-514}:514/tcp"

  db:
    ports: !override []

  duckdns:
    profiles: ["dynamic-dns"]
    image: alpine:3.20
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    command: >
      sh -c 'apk add --no-cache curl >/dev/null &&
      while true; do
        result=$$(curl -fsS "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=" || echo FAIL);
        echo "[duckdns] $$(date -u +%FT%TZ) $$DUCKDNS_SUBDOMAIN -> $$result";
        sleep 300;
      done'

volumes:
  caddydata:
  caddyconfig:
