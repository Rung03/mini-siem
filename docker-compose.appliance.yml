services:
  db:
    ports: !override
      - "127.0.0.1:${DB_PUBLISH_PORT:-5433}:5432"

  backend:
    environment:
      DEPLOY_PROFILE: appliance
      WEBHOOKS_ENABLED: "false"
      COOKIE_SECURE: "false"
    ports: !override
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "${SYSLOG_UDP_PORT:-514}:514/udp"
      - "${SYSLOG_TCP_PORT:-514}:514/tcp"

  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8081}:80"
      - "127.0.0.1:${WEB_TLS_PORT:-8443}:443"
